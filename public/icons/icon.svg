<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#000000"/>
  <g transform="translate(256, 256) scale(0.9)">
    <!-- Right wing facet -->
    <polygon points="120,-120 28,130 -38,38" fill="#ffffff"/>
    <!-- Left wing facet with subtle silver shade -->
    <polygon points="120,-120 -130,28 -38,38" fill="#d4d4d8"/>
    <!-- Central spine -->
    <line x1="120" y1="-120" x2="-38" y2="38" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
    <!-- Orbit velocity accent dot -->
    <circle cx="150" cy="-150" r="14" fill="#ffffff"/>
  </g>
</svg>
